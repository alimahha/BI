version: 2

sources:
  - name: training
    description: "Données de ventes d'exemple par pays, chargées depuis training.sql"
    schema: TRAINING
    tables:
      - name: sales_india
        description: "Ventes journalières en Inde"
        columns: &sales_columns
          - name: sales_date
            description: "Date de la vente"
            tests:
              - not_null
              - unique
          - name: quantity_sold
            description: "Quantité vendue dans la journée"
          - name: unit_sell_price
            description: "Prix de vente unitaire"
          - name: unit_purchase_cost
            description: "Coût d'achat unitaire"

      - name: sales_uk
        description: "Ventes journalières au Royaume-Uni"
        columns: *sales_columns

      - name: sales_us
        description: "Ventes journalières aux États-Unis"
        columns: *sales_columns

  - name: bronze
    description: "Données brutes chargées depuis le système source, sans transformation"
    schema: bronze
    tables:
      - name: customers
        description: "Clients : une ligne par client"
        columns:
          - name: customerid
            description: "Identifiant unique du client"
            tests:
              - unique
              - not_null
          - name: firstname
            description: "Prénom"
          - name: lastname
            description: "Nom de famille"
          - name: email
            description: "Adresse e-mail"
          - name: phone
            description: "Numéro de téléphone"
          - name: address
            description: "Adresse postale"
          - name: city
            description: "Ville"
          - name: state
            description: "État / région"
          - name: zipcode
            description: "Code postal"
          - name: updated_at
            description: "Date de dernière mise à jour de la ligne"

      - name: orders
        description: "Commandes : une ligne par commande"
        columns:
          - name: orderid
            description: "Identifiant unique de la commande"
            tests:
              - unique
              - not_null
          - name: orderdate
            description: "Date de la commande"
          - name: customerid
            description: "Client ayant passé la commande"
          - name: employeeid
            description: "Employé ayant traité la commande"
          - name: storeid
            description: "Magasin où la commande a été passée"
          - name: status
            description: "Statut : 01 = En cours, 02 = Terminée, 03 = Annulée"
          - name: updated_at
            description: "Date de dernière mise à jour de la ligne"

      - name: orderitems
        description: "Lignes de commande : une ligne par produit d'une commande"
        columns:
          - name: orderid
            description: "Commande à laquelle appartient la ligne"
            tests:
              - not_null
          - name: orderitemid
            description: "Numéro de la ligne dans la commande"
          - name: productid
            description: "Produit commandé"
          - name: quantity
            description: "Quantité commandée"
          - name: unitprice
            description: "Prix unitaire"
          - name: updated_at
            description: "Date de dernière mise à jour de la ligne"

  # Tables gold produites par dbt : dans les modèles, utiliser ref(), pas source()
  - name: gold
    description: "Données agrégées prêtes pour l'analyse, construites par les modèles de models/gold/"
    schema: gold
    tables:
      - name: fact_orders
        description: "Nombre et montant des commandes par client, employé, magasin et statut"
      - name: customer_revenue
        description: "Nombre de commandes et revenu par client, avec son nom complet"
      - name: store_performance
        description: "Revenu réel, objectif, écart et taux d'atteinte par magasin"
